; example vbit config file
; lines beginning with a semicolon are comment lines
; settings are in the form name=value and there must be no whitespace.

;--------------------------------- HEADER ROW ---------------------------------
; header template value must be 32 teletext characters long.
; both 8-bit control codes and 7-bit tti escape sequences are supported.
; %%# is replaced by the page number
; time and date use a subset of posix strftime conversion specifier characters
; pre-padded with % symbols to the appropriate length.
; day name = %%a
; day name, two characters = %c
; month name = %%b
; day number with leading zero = %d
; day number without leading zero = %e
; month number = %m
; 2 digit year = %y
; hour = %H
; minute = %M
; second = %S
; number of the subpage being broadcast, with leading zero = %t
; number of the subpage being broadcast, without leading zero = %T
; total number of subpages of the page, with leading zero = %u
; total number of subpages of the page, without leading zero = %U
; the day and month names use the language selected by the date_region
; setting, or the language of the system locale if it is not set
; here are some historic examples of header rows:
;header_template=CEEFAX %%#  %%a %e %%b C%H:%M/%S
;header_template=CEEFAX 1 %%# %%a %d %%bC%H:%M/%S
;header_template=ORACLE %%# %%a%e %%b ITVB%H%M:%S
;header_template=ORACLE %%# %%a%e %%bCITV %H%M:%S
;header_template=Teletext on 4 %%# %%b%dC%H:%M:%S
;header_template=D]CTeletext G\%%# %%b%dC%H:%M:%S

; TEEFAX header
header_template=TEEFAX %%#  %%a %e %%b C%H:%M/%S

;------------------------------ CLOCK MESSAGE --------------------------------
; the clock in the header row can be replaced every so often by a message which
; scrolls from right to left and then gives way to the clock again.
; the message is written over the clock, so the number of characters shown at
; once is the same as the clock (8 for %H:%M/%S or %H:%M:%S).
; clock_message_frequency is the number of seconds of clock between appearances.
; clock_message_speed is the scrolling speed in characters per second. keep it
; low, because a header is only picked up again when the page is repeated, so a
; fast message moves in large jumps.
;clock_message=BROADCAST STARTS AT 6 PM
;clock_message_speed=2
;clock_message_frequency=30

;---------------------------- INITIAL TELETEXT PAGE ---------------------------
; magazine, page, and subcode to transmit within broadcast data service packets
; magazine and page number are specified as you would on a teletext set.
; i.e. magazine 1-8 followed by two hex digits for example 100, 888, 19F, etc.
; the initial subcode can optionally be appended, separated by a colon.
;initial_teletext_page=100
;initial_teletext_page=100:3F7F

;------------------------------ SERVICE SETTINGS ------------------------------
; omit blank rows to increase transmission efficiency (defaults to false)
;row_adaptive_mode=false

; specify number of VBI lines per video field
;lines_per_field=16

; set the priority of each magazine. 1=highest priority, 9=lowest.
; eight comma separated values for magazines 8,1,2,3,4,5,6,7.
;magazine_priority=9,3,3,6,3,3,5,6

; how the magazines are broadcast. parallel divides the vbi lines between the
; magazines, serial transmits one complete magazine at a time. (defaults to parallel)
;magazine_broadcast_mode=serial

; broadcast the pages in reverse order, from 899 down to 100 (defaults to false)
;reverse_page_broadcast=false

; language used for the day and month names in the header row, given as an
; iso 639-1 language code. defaults to the language of the system locale when
; that language is supported.
; supported: en pl de fr it es pt nl no sv fi da cs sk hu ro tr sr
; setting this also selects the matching teletext national option character
; set, so that accented characters are displayed correctly.
;date_region=pl

; 20 character status message for broadcast service data packet
; as with the header template, 8-bit control codes (0x80 to 0x9f) and 7-bit
; tti escape sequences (escape 0x1b followed by the code plus 0x40) can be
; included to set the display attributes, for example 0x83 or escape 'C' for
; yellow. control codes count towards the 20 characters.
status_display=TEEFAX

; 16 bit hexadecimal code assigned to network in ETSI TR 101 231
; defaults to 0000 (no NI code assigned)
;network_identification_code=0000

; 16 bit hexadecimal code assigned for PDC
;country_network_identification=0000
